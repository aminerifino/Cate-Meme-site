<meta charset="utf-8">

<style>
:root{
  color-scheme:light;
  --bg:#FFFFFF;
  --bg2:#FBF8F9;
  --card-bg:#FFFFFF;
  --ivory:#16131B;
  --dim:#665D6F;
  --gold:#F4A8BA;
  --gold-soft:#F4A8BA;
  --ember:#E06085;
  --disp:"Newsreader",Georgia,serif;
  --word:"Cinzel",Georgia,serif;
  --ui:"Space Grotesk",system-ui,sans-serif;
  --mono:"Space Mono",ui-monospace,monospace;
  --shell:min(1100px,calc(100% - 2.5rem));
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--ivory);
  font-family:var(--ui);font-size:16px;line-height:1.6;
  overflow-x:hidden;-webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
.shell{width:var(--shell);margin-inline:auto}

/* Top Navigation */
.top{
  position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;
  padding:1rem clamp(1rem,3vw,2rem);
  background:rgba(255,255,255,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(244,168,186,.3);
}
.brand img, .brand-img{width:28px;height:28px;border-radius:50%;object-fit:cover;box-shadow:0 0 12px rgba(244,168,186,.7);display:inline-block;vertical-align:middle}
.brand{display:flex;align-items:center;gap:.7rem;font-family:var(--mono);font-size:.85rem;letter-spacing:.2em;color:var(--gold);font-weight:700}
.brand-icon{font-size:1.4rem;display:inline-block;filter:drop-shadow(0 0 10px rgba(244,168,186,.8))}
.top__nav{display:flex;align-items:center;gap:1.5rem}
.top__link{font-size:.85rem;font-weight:600;letter-spacing:.05em;color:var(--dim);transition:color .2s;position:relative}
.top__link:hover,.top__link.active{color:var(--ember)}
.top__link.active::after{content:'';position:absolute;bottom:-6px;left:0;right:0;height:2px;background:var(--gold);border-radius:2px}
.btn-gold{
  background:var(--gold);color:#FFFFFF;font-weight:700;font-size:.8rem;padding:.55rem 1.1rem;
  border-radius:999px;letter-spacing:.05em;transition:all .2s;box-shadow:0 0 16px rgba(244,168,186,.45);
}
.btn-gold:hover{transform:translateY(-2px);box-shadow:0 0 24px rgba(244,168,186,.7);color:#FFFFFF}

/* Studio Layout */
.hero{padding:3rem 0 1.5rem;text-align:center}
.badge{
  display:inline-flex;align-items:center;gap:.5rem;padding:.35rem .9rem;border-radius:999px;
  background:rgba(244,168,186,.15);border:1px solid rgba(244,168,186,.5);color:var(--ember);
  font-family:var(--mono);font-size:.75rem;letter-spacing:.15em;text-transform:uppercase;margin-bottom:1rem;font-weight:700;
}
.hero-title{font-family:var(--disp);font-size:clamp(2.3rem,5vw,3.6rem);margin:0 0 .5rem;font-weight:400;color:var(--ivory)}
.hero-title em{font-style:italic;color:var(--gold);font-family:var(--disp)}

.studio-grid{display:grid;grid-template-columns:1fr 1.1fr;gap:2rem;margin-bottom:4rem;align-items:start}
@media (max-width:850px){.studio-grid{grid-template-columns:1fr}}

.preview-col{
  background:var(--card-bg);border:1px solid rgba(244,168,186,.35);border-radius:20px;padding:1.5rem;
  display:flex;flex-direction:column;align-items:center;box-shadow:0 14px 40px rgba(0,0,0,.06);
}
canvas{
  max-width:100%;height:auto;border-radius:14px;border:1px solid rgba(244,168,186,.4);
  box-shadow:0 10px 30px rgba(0,0,0,.08);
}
.canvas-actions{display:flex;gap:.8rem;margin-top:1.2rem;width:100%}
.studio-btn{
  flex:1;padding:.8rem;border-radius:10px;font-weight:700;font-size:.9rem;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:.4rem;border:none;transition:all .2s;
}
.studio-btn.download{background:var(--gold);color:#FFFFFF}
.studio-btn.download:hover{background:var(--ember);transform:translateY(-2px)}
.studio-btn.share{background:#1d9bf0;color:#fff}
.studio-btn.share:hover{background:#0c85d0;transform:translateY(-2px)}

.controls-col{
  background:var(--card-bg);border:1px solid rgba(244,168,186,.35);border-radius:20px;padding:2rem;
  display:flex;flex-direction:column;gap:1.5rem;box-shadow:0 10px 30px rgba(0,0,0,.04);
}
.ctrl-group label{display:block;font-size:.85rem;font-weight:700;color:var(--ember);margin-bottom:.6rem;text-transform:uppercase;letter-spacing:.08em}
.theme-options{display:grid;grid-template-columns:repeat(4,1fr);gap:.6rem}
.theme-btn{
  padding:.6rem;border-radius:8px;border:1px solid rgba(244,168,186,.3);background:rgba(244,168,186,.08);
  color:var(--ivory);font-size:.8rem;cursor:pointer;text-align:center;transition:all .2s;
}
.theme-btn.active{background:var(--gold);color:#FFFFFF;font-weight:bold;border-color:var(--gold)}

.acc-options{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem}
.acc-btn{
  padding:.7rem;border-radius:8px;border:1px solid rgba(244,168,186,.3);background:rgba(244,168,186,.08);
  color:var(--ivory);font-size:.85rem;cursor:pointer;text-align:center;transition:all .2s;
}
.acc-btn.active{background:rgba(244,168,186,.25);border-color:var(--gold);color:var(--ember);font-weight:bold}

.text-input{
  width:100%;padding:.75rem 1rem;background:rgba(251,248,249,.95);border:1px solid rgba(244,168,186,.35);
  border-radius:8px;color:var(--ivory);font-family:var(--ui);font-size:.95rem;outline:none;
}
.text-input:focus{border-color:var(--gold)}

footer{padding:3rem 0;border-top:1px solid rgba(244,168,186,.3);text-align:center;color:var(--dim);font-size:.85rem;background:var(--bg2)}
@media (max-width:768px){.top__nav{display:none}}
</style>
</head>
<body>

<header class="top">
  <a class="brand" href="/"><img src="/images/zpO5lsW__400x400.jpg" alt="Logo" class="brand-img"> CATE STUDIO</a>
  <nav class="top__nav">
    <a class="top__link" href="/#l1">Story</a>
    <a class="top__link" href="/learn">Learn</a>
    <a class="top__link" href="/raids">Raids</a>
    <a class="top__link" href="/arcade">Arcade</a>
    <a class="top__link active" href="/studio">Studio</a>
    <a class="top__link" href="/vocab">Vocab</a>
  </nav>
  <div class="top__actions">
    <a class="btn-gold" href="https://pump.fun/coin/8k4sBtEeK4pf26noKqApv8NBTnuSJcbdwpKYknk5PbAA" target="_blank" rel="noopener noreferrer">BUY $CATE</a>
  </div>
</header>

<main class="shell">
  <section class="hero">
    <div class="badge">MEME & PFP CREATOR 1.0</div>
    <h1 class="hero-title">Forge Your <em>Ninth Life PFP</em></h1>
    <p style="color:var(--dim);margin:0 auto;max-width:500px">Customize your Cate avatar with laser eyes, golden crowns, and viral text banners.</p>
  </section>

  <div class="studio-grid">
    <div class="preview-col">
      <canvas id="pfpCanvas" width="500" height="500"></canvas>
      <div class="canvas-actions">
        <button class="studio-btn download" onclick="downloadPFP()">💾 Download PFP</button>
        <button class="studio-btn share" onclick="shareX()">🚀 Share to X</button>
      </div>
    </div>

    <div class="controls-col">
      <div class="ctrl-group">
        <label>1. Canvas Atmosphere</label>
        <div class="theme-options">
          <button class="theme-btn active" onclick="setTheme('pink', this)">Pink Aura</button>
          <button class="theme-btn" onclick="setTheme('cloud', this)">Pure White</button>
          <button class="theme-btn" onclick="setTheme('obsidian', this)">Dark Core</button>
          <button class="theme-btn" onclick="setTheme('solana', this)">Solana</button>
        </div>
      </div>

      <div class="ctrl-group">
        <label>2. Headgear & Accessories</label>
        <div class="acc-options">
          <button class="acc-btn active" id="accLaser" onclick="toggleAcc('laser', this)">⚡ Laser Eyes</button>
          <button class="acc-btn" id="accCrown" onclick="toggleAcc('crown', this)">👑 Gold Crown</button>
          <button class="acc-btn" id="accGlasses" onclick="toggleAcc('glasses', this)">🕶️ 8-Bit Shades</button>
          <button class="acc-btn" id="accHelmet" onclick="toggleAcc('helmet', this)">🚀 Space Helmet</button>
          <button class="acc-btn" id="accPaws" onclick="toggleAcc('paws', this)">🐾 Gold Paws</button>
          <button class="acc-btn" id="accSparkles" onclick="toggleAcc('sparkles', this)">✨ Magic Aura</button>
        </div>
      </div>

      <div class="ctrl-group">
        <label>3. Top Text Caption</label>
        <input type="text" class="text-input" id="topTextInput" placeholder="E.g. 8 LIVES WERE HERS..." oninput="renderPFP()">
      </div>

      <div class="ctrl-group">
        <label>4. Bottom Text Caption</label>
        <input type="text" class="text-input" id="bottomTextInput" placeholder="E.g. THE NINTH IS YOURS." value="THE NINTH LIFE · $CATE" oninput="renderPFP()">
      </div>
    </div>
  </div>
</main>

<footer>
  <div class="shell">
    <p>© 2026 THE CATECOIN COMMUNITY · MEME STUDIO 1.2 · THE NINTH LIFE</p>
  </div>
</footer>

<script>
var canvas = document.getElementById('pfpCanvas');
var ctx = canvas.getContext('2d');
var currentTheme = 'pink';
var accessories = {
  laser: true,
  crown: false,
  glasses: false,
  helmet: false,
  paws: false,
  sparkles: false
};

function setTheme(theme, btn){
  currentTheme = theme;
  document.querySelectorAll('.theme-btn').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  renderPFP();
}

function toggleAcc(acc, btn){
  accessories[acc] = !accessories[acc];
  btn.classList.toggle('active', accessories[acc]);
  renderPFP();
}

function renderPFP(){
  var W = canvas.width, H = canvas.height;
  
  // Background
  if(currentTheme === 'pink'){
    var g = ctx.createRadialGradient(W/2, H/2, 50, W/2, H/2, 280);
    g.addColorStop(0, '#FFE8EE'); g.addColorStop(1, '#F4A8BA');
    ctx.fillStyle = g;
  } else if(currentTheme === 'cloud'){
    var g = ctx.createRadialGradient(W/2, H/2, 50, W/2, H/2, 280);
    g.addColorStop(0, '#FFFFFF'); g.addColorStop(1, '#F5EDF0');
    ctx.fillStyle = g;
  } else if(currentTheme === 'obsidian'){
    var g = ctx.createRadialGradient(W/2, H/2, 50, W/2, H/2, 280);
    g.addColorStop(0, '#2D1E26'); g.addColorStop(1, '#150D12');
    ctx.fillStyle = g;
  } else {
    var g = ctx.createLinearGradient(0, 0, W, H);
    g.addColorStop(0, '#F4A8BA'); g.addColorStop(1, '#9945FF');
    ctx.fillStyle = g;
  }
  ctx.fillRect(0,0,W,H);

  // Border ring
  ctx.strokeStyle = 'rgba(244,168,186,0.6)';
  ctx.lineWidth = 8;
  ctx.strokeRect(10,10,W-20,H-20);

  // Aura/Sparkles
  if(accessories.sparkles){
    ctx.font = '36px sans-serif';
    ctx.fillText('✨', 60, 100);
    ctx.fillText('✨', 400, 120);
    ctx.fillText('✨', 80, 380);
    ctx.fillText('✨', 390, 390);
  }

  // Base Cat Illustration
  ctx.font = '160px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('🐱', W/2, H/2);

  // Accessories Layer
  if(accessories.crown){
    ctx.font = '64px sans-serif';
    ctx.fillText('👑', W/2, H/2 - 100);
  }
  if(accessories.helmet){
    ctx.strokeStyle = 'rgba(244,168,186,0.9)';
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.arc(W/2, H/2 - 10, 115, 0, Math.PI*2);
    ctx.stroke();
  }
  if(accessories.glasses){
    ctx.font = '64px sans-serif';
    ctx.fillText('🕶️', W/2, H/2 - 10);
  }
  if(accessories.laser){
    ctx.strokeStyle = '#F4A8BA';
    ctx.lineWidth = 5;
    ctx.shadowColor = '#E06085';
    ctx.shadowBlur = 15;
    // Left eye beam
    ctx.beginPath(); ctx.moveTo(W/2 - 28, H/2 - 15); ctx.lineTo(0, H/2 + 70); ctx.stroke();
    // Right eye beam
    ctx.beginPath(); ctx.moveTo(W/2 + 28, H/2 - 15); ctx.lineTo(W, H/2 + 70); ctx.stroke();
    ctx.shadowBlur = 0;
  }
  if(accessories.paws){
    ctx.font = '50px sans-serif';
    ctx.fillText('🐾', W/2 - 70, H/2 + 90);
    ctx.fillText('🐾', W/2 + 70, H/2 + 90);
  }

  // Text Banners
  var topTxt = document.getElementById('topTextInput').value.trim();
  var botTxt = document.getElementById('bottomTextInput').value.trim();

  ctx.font = '700 24px "Space Grotesk", sans-serif';
  ctx.fillStyle = '#FFFFFF';
  ctx.strokeStyle = '#16131B';
  ctx.lineWidth = 4;

  if(topTxt){
    ctx.strokeText(topTxt, W/2, 60);
    ctx.fillText(topTxt, W/2, 60);
  }
  if(botTxt){
    ctx.font = '700 22px "Space Grotesk", sans-serif';
    ctx.fillStyle = '#F4A8BA';
    ctx.strokeText(botTxt, W/2, H - 45);
    ctx.fillText(botTxt, W/2, H - 45);
  }
}

function downloadPFP(){
  var a = document.createElement('a');
  a.download = 'cate-pfp.png';
  a.href = canvas.toDataURL('image/png');
  a.click();
}

function shareX(){
  var text = encodeURIComponent("Check out my official $CATE PFP! The ninth life is ours. 🐱⚡ CA: 8k4sBtEeK4pf26noKqApv8NBTnuSJcbdwpKYknk5PbAA #CATE #Solana");
  window.open("https://twitter.com/intent/tweet?text=" + text, "_blank");
}

renderPFP();
</script>
</body>
</html>
